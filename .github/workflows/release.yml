name: Create GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Verify JAR exists
        run: |
          if [ ! -f bin/mongo-util.jar ]; then
            echo "ERROR: bin/mongo-util.jar not found!"
            exit 1
          fi
          ls -lh bin/mongo-util.jar

      - name: Verify JAR manifest version matches tag
        run: |
          MANIFEST_VERSION=$(unzip -p bin/mongo-util.jar META-INF/MANIFEST.MF | tr -d '\r' | sed -n 's/^Implementation-Version: //p')
          if [ -z "$MANIFEST_VERSION" ]; then
            echo "ERROR: bin/mongo-util.jar manifest has no Implementation-Version entry!"
            exit 1
          fi
          if [ "$MANIFEST_VERSION" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "ERROR: committed bin/mongo-util.jar was built for version $MANIFEST_VERSION, but this tag is v${{ steps.version.outputs.VERSION }}."
            echo "The jar must be rebuilt with 'mvn clean package -DskipTests' AFTER bumping pom.xml, and committed together with the pom.xml bump before tagging."
            exit 1
          fi
          echo "OK: jar manifest version ($MANIFEST_VERSION) matches tag (v${{ steps.version.outputs.VERSION }})"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} \
            bin/mongo-util.jar \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes

      - name: Release Summary
        run: |
          echo "✅ Release ${{ github.ref_name }} created successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts Published" >> $GITHUB_STEP_SUMMARY
          echo "- \`bin/mongo-util.jar\` (shaded JAR for standalone use)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "To publish to Maven Central, run locally:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "mvn deploy -Prelease" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
